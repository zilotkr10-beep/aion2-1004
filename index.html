<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:dark}body{margin:0}[hidden]{display:none!important}</style>
<title>아이온2 주간 파티 트래커</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: dark console look. Header (title left, count + bar right), toolbar with legend, then a two-panel row (order / next) and two-column party tables. */
:root {
  color-scheme: dark;
  --bg: #14171d;
  --panel: #1d2129;
  --panel-2: #232832;
  --line: #2f3541;
  --fg: #e9ebf0;
  --muted: #8d95a4;
  --gold: #e8b34a;
  --gold-fg: #1a1608;
  --green: #4cc16a;
  --green-soft: #1f3b27;
  --pink: #ff62c4;
  --orange: #f5a23c;
  --white: #ffffff;
  --font-display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.5;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.top > div { min-width: 0; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 32px; line-height: 1.15; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--gold); }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stat { display: flex; align-items: center; gap: 12px; }
.stat .n { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--green); font-variant-numeric: tabular-nums; }
.stat .of { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { width: 200px; max-width: 40vw; height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 5px; }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font-weight: 700; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: var(--gold-fg); }
.btn.armed { background: var(--orange); border-color: var(--orange); color: var(--gold-fg); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.main { background: var(--white); } .dot.sub { background: var(--pink); } .dot.low { background: var(--orange); } .dot.base { background: var(--muted); }
.who { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.who b { color: var(--fg); }
.link { background: none; border: 0; padding: 2px 4px; color: var(--fg); font-weight: 500; }
.link:hover { color: var(--gold); }
.link.armed { color: var(--orange); font-weight: 700; }

.notice { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); font-size: 13px; }
.notice b { color: var(--fg); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.row2 { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.box { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.box h2 { margin: 0; font-size: 13px; font-weight: 500; color: var(--muted); }
.seq { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; }
.seq .arrow { color: var(--muted); font-size: 12px; }
.sn { min-width: 38px; height: 36px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums; background: var(--panel-2); color: var(--fg); }
.sn.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.sn.cur { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.cap { margin: 0; color: var(--muted); font-size: 13px; }
.allgood { color: var(--green); font-weight: 800; font-size: 15px; margin: 0; }
.nextno { font-family: var(--font-display); font-size: 22px; line-height: 1.2; margin: 0; }
.nextno small { font-family: var(--font-body); color: var(--muted); font-size: 13px; font-weight: 500; margin-left: 6px; }
.nl { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.nl li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.nl li > span:first-child { width: 72px; flex: none; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }

.tables { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.ph { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.ph h3 { margin: 0; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; }
.ph .cnt { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 420px; }
th { padding: 8px 6px; font-size: 12px; font-weight: 500; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
th button { background: none; border: 0; padding: 0 2px; color: inherit; font: inherit; }
th button:hover { color: var(--gold); }
td { padding: 6px; text-align: center; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.row.done td { background: var(--green-soft); }
tr:last-child td { border-bottom: 0; }
.w-ck { width: 52px; } .w-no { width: 44px; } .w-by { width: 64px; }
.ck { width: 24px; height: 24px; border-radius: 5px; border: 0; background: #464b57; display: inline-grid; place-items: center; color: transparent; vertical-align: middle; }
.ck svg { width: 16px; height: 16px; }
tr.done .ck { background: #62cf7c; color: #fff; }
.no { font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
tr.done .no { color: var(--green); }
.cellbtn { background: none; border: 0; padding: 4px 6px; border-radius: 4px; font-weight: 700; max-width: 100%; overflow-wrap: anywhere; }
.cellbtn:hover { background: var(--panel-2); }
.cellbtn small { margin-left: 4px; font-weight: 500; font-size: 11px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; text-decoration: none; display: inline-block; }
.t-base { color: #d5d9e1; } .t-main { color: var(--white); } .t-sub { color: var(--pink); } .t-low { color: var(--orange); }
.empty { color: var(--muted); font-weight: 400; }
tr.done .cellbtn .tx { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.by { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.pf { display: flex; justify-content: flex-end; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--line); }
.pf .link { color: var(--muted); font-size: 13px; }
.pf .link:hover { color: var(--fg); }
.pf .link.armed { color: var(--orange); }

.ed { padding: 12px 8px; display: flex; flex-direction: column; gap: 10px; text-align: left; background: var(--panel); }
tr.edrow td { padding: 0; background: var(--panel); }
.ed .lb { color: var(--muted); font-size: 13px; }
.ed input, .field input, .field textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; width: 100%; }
.ed input.main { border-color: var(--gold); border-width: 2px; font-weight: 700; font-size: 15px; padding: 9px 10px; border-radius: 8px; }
.ed .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ed .hint, .hint { margin: 0; font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.chip.sel { border-color: var(--gold); border-width: 2px; padding: 3px 11px; }
.eact { display: flex; align-items: center; gap: 8px; }
.eact .grow { flex: 1; }

.roster { overflow: hidden; }
.rh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 14px; }
.rh h2 { margin: 0; font-size: 16px; font-weight: 800; }
.rh .cnt { color: var(--muted); font-size: 13px; }
.rh .sp { flex: 1; }
.rb { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.pick { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; background: var(--panel-2); border: 1px solid var(--gold); border-radius: 6px; padding: 8px 12px; font-size: 13px; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mc { display: inline-flex; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.mc.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.mc.used .pk { opacity: .65; }
.mc .pk { background: none; border: 0; padding: 5px 4px 5px 10px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.mc .pw { font-weight: 500; font-size: 11px; color: var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.mc .bd { font-weight: 700; font-size: 11px; color: var(--green); }
.mc .ed2 { background: none; border: 0; color: var(--muted); font-size: 12px; padding: 6px 8px; border-radius: 0 8px 8px 0; }
.mc .ed2:hover { color: var(--fg); background: var(--panel); }
.placing .cellbtn { outline: 1px dashed var(--gold); outline-offset: -1px; }
.ed select, .field select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
.cl { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--fg); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; gap: 8px; }
.prow label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.prow input { width: 130px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; text-align: right; }
.overlay { position: fixed; inset: 0; background: rgba(5, 7, 12, .66); display: grid; place-items: center; z-index: 20; padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: 100%; max-width: 480px; max-height: 100%; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.modal h2 { margin: 0; font-size: 18px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field textarea { min-height: 96px; resize: vertical; }
.actions { display: flex; justify-content: flex-end; gap: 8px; }
.err { margin: 0; color: var(--orange); font-size: 13px; }
.loading, .blank { padding: 28px 16px; text-align: center; color: var(--muted); }
.blank { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.blank .actions { justify-content: center; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-weight: 500; z-index: 30; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  .row2, .tables { grid-template-columns: minmax(0, 1fr); }
  .who { margin-left: 0; width: 100%; }
}
@media (max-width: 480px) {
  h1 { font-size: 26px; }
  .ed .two { grid-template-columns: 1fr; }
}
</style>

</head>
<body>
<div class="page">
  <div class="top">
    <div>
      <h1>아이온<span>2</span> 주간 파티 트래커</h1>
      <p class="sub" id="subline">불러오는 중…</p>
    </div>
    <div class="stat"><span class="n" id="doneN">0</span><span class="of">/ <span id="totalN">0</span> 파티 완료</span><div class="bar"><i id="barFill" style="width:0%"></i></div></div>
  </div>

  <div class="tools">
    <button class="btn gold" id="weeklyBtn" data-act="weekly">주간 초기화</button>
    <button class="btn" data-act="power">전투력 갱신</button>
    <button class="btn" data-act="settings">설정</button>
    <button class="btn" data-act="addTable">+ 표 추가</button>
    <span class="legend"><span><i class="dot main"></i>본계정</span><span><i class="dot sub"></i>부계정</span><span><i class="dot low"></i>납틀 500k 미만</span></span>
    <span class="who">체크하는 사람: <b id="checker">-</b><button class="link" data-act="checker">변경</button></span>
  </div>

  <div id="sampleNote" class="notice" hidden></div>
  <div id="app"><p class="loading">불러오는 중…</p></div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  var CK = 'aion2-party-checker', LK = 'aion2-party-local-v1';
  var TAGS = [['base', '기본'], ['main', '본계정'], ['sub', '부계정'], ['low', '납틀 500k 미만']];
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  var S = { tables: {}, parties: {}, meta: {}, members: {} };
  var JOBS = ['검성', '수호', '살성', '궁성', '마도', '정령', '치유', '호법'];
  var picked = '', onlyFree = false, rosterOpen = true;
  try { rosterOpen = localStorage.getItem('aion2-roster-open') !== '0'; } catch (e) {}
  var db = null, mode = 'loading', loaded = { t: false, p: false, m: false };
  var editing = null, armed = {}, checker = '';
  try { checker = localStorage.getItem(CK) || ''; } catch (e) {}

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function emptyCell() { return { t: '', tag: 'base', char: '', server: '', power: 0, m: '' }; }
  function parsePower(s) {
    s = String(s || '').trim().replace(/,/g, '');
    var m = /^([\d.]+)\s*([kKmM]?)$/.exec(s);
    if (!m) return 0;
    var n = parseFloat(m[1]), u = m[2].toLowerCase();
    if (u === 'k') n *= 1e3; if (u === 'm') n *= 1e6;
    return Math.round(n) || 0;
  }
  function fmtPower(n) {
    if (!n) return '';
    if (n >= 1e6) return (Math.round(n / 1e4) / 100) + 'M';
    if (n >= 1e3) return Math.round(n / 1e3) + 'k';
    return String(n);
  }
  function effTag(c) {
    var g = c.tag || 'base';
    if (g === 'base' && c.power > 0 && c.power < 500000) return 'low';
    return g;
  }

  // ---- roster helpers ----
  function memberList() {
    return Object.keys(S.members || {}).map(function (id) { var m = S.members[id]; return { id: id, name: m.name || '', job: m.job || '', power: m.power || 0, tag: m.tag || 'base' }; })
      .sort(function (a, b) { return (b.power - a.power) || (a.name < b.name ? -1 : 1); });
  }
  function memberText(m) { return (m.job || '') + (m.name ? (m.job ? '(' + m.name + ')' : m.name) : ''); }
  function resolveCell(c) {
    if (c && c.m && S.members && S.members[c.m]) { var m = S.members[c.m]; return { t: memberText(m), tag: m.tag || 'base', power: m.power || 0, m: c.m }; }
    return c;
  }
  function assignMap() {
    var map = {};
    Object.keys(S.parties).forEach(function (id) { var p = S.parties[id]; (p.cells || []).forEach(function (c) { if (c && c.m) (map[c.m] = map[c.m] || []).push(p.no); }); });
    Object.keys(map).forEach(function (k) { map[k].sort(function (a, b) { return a - b; }); });
    return map;
  }
  // Put a roster member into one slot. Inside the same table a member sits in one slot only, so an older slot is emptied.
  function placeMember(pid, idx, mid) {
    var p = S.parties[pid], m = S.members[mid];
    if (!p || !m) return;
    var changes = {};
    allParties().forEach(function (q) {
      if (q.table !== p.table) return;
      cellsOf(q).forEach(function (c, i) {
        if (c.m === mid && !(q.id === pid && i === idx)) { changes[q.id] = changes[q.id] || cellsOf(q).slice(); changes[q.id][i] = emptyCell(); }
      });
    });
    changes[pid] = changes[pid] || cellsOf(p).slice();
    changes[pid][idx] = { t: memberText(m), tag: m.tag || 'base', char: '', server: '', power: m.power || 0, m: mid };
    (async function () { for (var id in changes) await op('update', 'parties/' + id, { cells: changes[id] }); })();
  }

  // ---- data access ----
  function tablesSorted() {
    return Object.keys(S.tables).map(function (id) { var t = S.tables[id]; return { id: id, title: t.title, cols: t.cols || [], order: t.order || 0 }; })
      .sort(function (a, b) { return a.order - b.order || (a.id < b.id ? -1 : 1); });
  }
  function allParties() {
    return Object.keys(S.parties).map(function (id) { var p = S.parties[id]; return { id: id, no: p.no, table: p.table, done: !!p.done, doneBy: p.doneBy || '', doneAt: p.doneAt || 0, cells: p.cells || [] }; })
      .sort(function (a, b) { return a.no - b.no; });
  }
  function colsOf(p) { return (S.tables[p.table] && S.tables[p.table].cols) || []; }
  function cellsOf(p) {
    var n = colsOf(p).length, arr = (p.cells || []).slice();
    while (arr.length < n) arr.push(emptyCell());
    return arr.slice(0, n);
  }
  function filled(p) { var c = cellsOf(p); if (!c.length) return false; for (var i = 0; i < c.length; i++) if (!resolveCell(c[i]).t) return false; return true; }
  function seqList() {
    var ps = allParties(), by = {}, arr;
    ps.forEach(function (p) { by[p.no] = p; });
    var st = S.meta.settings || {};
    if (st.sequence && st.sequence.length) arr = st.sequence.filter(function (n) { return by[n]; });
    else arr = ps.filter(filled).map(function (p) { return p.no; });
    return arr.map(function (n) { return by[n]; });
  }

  // ---- persistence: shared db when available, otherwise this browser only ----
  function parsePath(path) { var a = path.split('/'); return { c: a[0], id: a[1] }; }
  function localSave() { try { localStorage.setItem(LK, JSON.stringify(S)); } catch (e) {} }
  function failed(e) {
    if (e && e.code === 'invalid_argument') toast('저장할 수 없어요. 보기 전용이거나 바꿀 권한이 없습니다.');
    else toast('저장하지 못했어요. 잠시 뒤 다시 시도하세요.');
  }
  var REMOTE_KEY = 'aion2-party-remote', remoteBase = '', lastJson = '';
  function applyLocal(kind, path, data) {
    var p = parsePath(path);
    if (kind === 'set') S[p.c][p.id] = data;
    else if (kind === 'update') S[p.c][p.id] = Object.assign({}, S[p.c][p.id], data);
    else delete S[p.c][p.id];
  }
  async function op(kind, path, data) {
    applyLocal(kind, path, data);
    if (mode === 'remote') {
      render();
      try {
        var res = await fetch(remoteBase + '/aion2/' + path + '.json', {
          method: kind === 'set' ? 'PUT' : (kind === 'update' ? 'PATCH' : 'DELETE'),
          headers: { 'Content-Type': 'application/json' },
          body: kind === 'delete' ? undefined : JSON.stringify(data)
        });
        if (!res.ok) throw new Error(res.status);
      } catch (e) { toast('저장하지 못했어요. 공유 저장소 주소와 규칙을 확인하세요.'); }
      pull();
    } else { localSave(); render(); }
  }

  function makeSample() {
    var cls = ['검성', '수호', '살성', '궁성', '마도', '정령', '치유', '호법'];
    var out = { tables: {}, parties: {}, meta: { settings: { sample: true, sequence: null } }, members: {
      m1: { name: '예시A', job: '호법', power: 1030000, tag: 'main' }, m2: { name: '예시B', job: '치유', power: 520000, tag: 'base' },
      m3: { name: '예시C', job: '검성', power: 470000, tag: 'base' }, m4: { name: '예시D', job: '궁성', power: 880000, tag: 'sub' },
      m5: { name: '예시E', job: '마도', power: 760000, tag: 'main' }, m6: { name: '예시F', job: '살성', power: 690000, tag: 'base' }
    } };

    out.tables.t_erosion = { title: '침식', cols: ['파티원 A', '파티원 B', '파티원 C'], order: 2 };
    for (var n = 1; n <= 9; n++) {
      var cells = [];
      for (var k = 0; k < 3; k++) {
        var tag = ((n + k) % 5 === 0) ? 'sub' : (((n + k) % 4 === 0) ? 'main' : 'base');
        var power = 0;
        if (n === 2 && k === 1) power = 463000;
        if (n === 7 && k === 0) power = 1030000;
        if (n === 9 && k === 2) power = 963000;

  function startLocal() {

    else { S = makeSample(); localSave(); }
    loaded = { t: true, p: true, m: true };
    render();
  }
  var pulling = false;
  async function pull() {
    if (pulling) return;
    pulling = true;
    try {
      var res = await fetch(remoteBase + '/aion2.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      var d = (await res.json()) || {};
      var js = JSON.stringify(d);
      if (js !== lastJson || !loaded.t) {
        lastJson = js;
        S = { tables: d.tables || {}, parties: d.parties || {}, meta: d.meta || {}, members: d.members || {} };
        loaded = { t: true, p: true, m: true };
        render();
      }
    } catch (e) {
      if (!loaded.t) { loaded = { t: true, p: true, m: true }; toast('공유 저장소에 연결하지 못했어요. 설정에서 주소를 확인하세요.'); render(); }
    }
    pulling = false;
  }
  function startRemote(url) {
    mode = 'remote'; remoteBase = url.replace(/\/+$/, '');
    pull();
    setInterval(pull, 4000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) pull(); });
  }

  function openModal(title, body, saveLabel, onSave) {
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="overlay" data-overlay><form class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2>' + body +
      '<p class="err" id="modalErr" hidden></p><div class="actions"><button type="button" class="btn" data-close>취소</button><button type="submit" class="btn gold">' + saveLabel + '</button></div></form></div>';
    var form = root.querySelector('form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var r = onSave(form);
      if (typeof r === 'string') { var er = document.getElementById('modalErr'); er.textContent = r; er.hidden = false; return; }
      closeModal();
    });
    root.querySelector('[data-close]').addEventListener('click', closeModal);
    root.querySelector('[data-overlay]').addEventListener('mousedown', function (e) { if (e.target === e.currentTarget) closeModal(); });
    onKey = function (e) { if (e.key === 'Escape') closeModal(); };
    document.addEventListener('keydown', onKey);
    var f = form.querySelector('input, textarea'); if (f) f.focus();
  }

  function parseRoster(text) {
    var out = [];
    text.split(/\r?\n/).forEach(function (line) {
      if (!line.trim()) return;
      var cells = (line.indexOf('\t') >= 0 ? line.split('\t') : line.split(',')).map(function (c) { return c.trim(); }).filter(Boolean);
      var power = 0, tag = 'base', w = [];
      cells.forEach(function (c) {
        if (/^(본|본계정)$/.test(c)) tag = 'main';
        else if (/^(부|부계정)$/.test(c)) tag = 'sub';
        else if (/^[\d.,]+\s*[kKmM]?$/.test(c) && /\d/.test(c)) power = parsePower(c);
        else w.push(c);
      });
      if (!w.length || w[0] === '이름') return;
      out.push({ name: w[0], job: w[1] || '', power: power, tag: tag });
    });
    return out;
  }

  function dlgBulk() {
    openModal('인원 붙여넣기',
      '<label class="field">한 줄에 한 명 (이름, 직업, 전투력)<textarea id="m_text" placeholder="봄봄, 호법, 1.03M&#10;달빛, 검성, 987000&#10;별이, 치유, 760k, 부"></textarea></label>' +
      '<p class="hint">쉼표나 탭으로 나눕니다. 뒤에 본 또는 부를 적으면 본계정, 부계정으로 표시됩니다. 시트에서 복사한 내용도 그대로 붙여넣을 수 있습니다.</p>' +
      '<label class="cl"><input type="checkbox" id="m_replace"> 기존 인원을 모두 바꾸기</label>', '불러오기', function (f) {
        var list = parseRoster(f.querySelector('#m_text').value);
        if (!list.length) return '읽을 수 있는 줄이 없습니다. 이름, 직업, 전투력 순서인지 확인하세요.';
        var replace = f.querySelector('#m_replace').checked;
        (async function () {
          if (replace) { var old = Object.keys(S.members); for (var i = 0; i < old.length; i++) await op('delete', 'members/' + old[i]); }
          for (var j = 0; j < list.length; j++) await op('set', 'members/' + newMemberId(), list[j]);
          toast(list.length + '명을 불러왔어요');
        })();
      });
  }

  function dlgPower() {
    var ms = memberList();
    if (!ms.length) { toast('먼저 레기온 인원을 추가하세요'); return; }
    openModal('전투력 갱신', '<div class="plist">' + ms.map(function (m, i) {
      return '<div class="prow"><label for="pw_' + i + '">' + esc(memberText(m)) + '</label><input id="pw_' + i + '" inputmode="decimal" value="' + (m.power || '') + '"></div>';
    }).join('') + '</div><p class="hint">1.03M, 963k, 480000처럼 적을 수 있습니다. 표에 들어간 인원의 전투력도 함께 바뀝니다.</p>', '저장', function (f) {
      ms.forEach(function (m, i) { var v = parsePower(f.querySelector('#pw_' + i).value); if (v !== m.power) op('update', 'members/' + m.id, { power: v }); });
      toast('전투력을 갱신했어요');
    });
  }

  function dlgChecker() {
    openModal('체크하는 사람', '<label class="field">이름<input id="m_name" maxlength="20" value="' + esc(checker) + '" placeholder="캐릭터 또는 닉네임"></label><p class="hint">파티를 완료로 체크할 때 이 이름이 표에 함께 보입니다. 이 브라우저에 기억됩니다.</p>', '저장', function (f) {
      checker = f.querySelector('#m_name').value.trim();
      try { localStorage.setItem(CK, checker); } catch (e) {}
      render();
    });
  }

  function dlgSettings() {
    var seq = seqList().map(function (p) { return p.no; }).join(', ');
    var custom = !!((S.meta.settings || {}).sequence && S.meta.settings.sequence.length);
    var cur = ''; try { cur = localStorage.getItem(REMOTE_KEY) || ''; } catch (e) {}
    openModal('설정', '<label class="field">진행 순서 (파티 번호를 쉼표로 구분)<textarea id="m_seq" placeholder="1, 2, 3, 4, 10, 5">' + esc(custom ? seq : '') + '</textarea></label>' +
      '<p class="hint">비워 두면 모든 칸이 채워진 파티를 번호순으로 자동 정렬합니다. 순서에 없는 파티는 진행 순서와 다음 파티에 나오지 않습니다.</p>' +
      '<label class="field">공유 저장소 주소 (Firebase Realtime Database)<input id="m_remote" placeholder="https://내프로젝트-default-rtdb.firebaseio.com" value="' + esc(cur) + '"></label>' +
      '<p class="hint">비워 두면 이 기기의 브라우저에만 저장됩니다. 주소를 넣으면 같은 주소를 쓰는 모든 사람이 같은 표를 봅니다. 주소를 바꾸면 페이지가 새로고침됩니다.</p>', '저장', function (f) {
      var url = f.querySelector('#m_remote').value.trim();
      if (url && !/^https:\/\/[^\s]+$/.test(url)) return '공유 저장소 주소는 https:// 로 시작해야 합니다.';
      var nums = (f.querySelector('#m_seq').value.match(/\d+/g) || []).map(Number);
      var st = S.meta.settings || {};
      op('set', 'meta/settings', Object.assign({}, st, { sequence: nums.length ? nums : null }));
      if (url !== cur) {
        try { if (url) localStorage.setItem(REMOTE_KEY, url); else localStorage.removeItem(REMOTE_KEY); } catch (e) {}
        setTimeout(function () { location.reload(); }, 600);
      }
    });
  }

  function dlgAddTable() {
    openModal('표 추가', '<label class="field">표 이름<input id="m_title" maxlength="20" placeholder="예: 루드라"></label>' +
      '<label class="field">열 이름 (쉼표로 구분)<input id="m_cols" value="파티원 A, 파티원 B, 파티원 C"></label>' +
      '<label class="field">파티 수<input id="m_count" inputmode="numeric" value="5"></label>', '추가', function (f) {
      var title = f.querySelector('#m_title').value.trim();
      var cols = f.querySelector('#m_cols').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
      var count = parseInt(f.querySelector('#m_count').value, 10);
      if (!title) return '표 이름을 입력하세요.';
      if (!cols.length || cols.length > 8) return '열은 1개에서 8개까지 가능합니다.';
      if (!(count >= 1 && count <= 30)) return '파티 수는 1에서 30 사이로 입력하세요.';
      createTable(title, cols, count);
    });
  }

  async function createTable(title, cols, count) {
    var tbs = tablesSorted(), ps = allParties();
    var order = tbs.length ? tbs[tbs.length - 1].order + 1 : 1;
    var maxNo = ps.length ? ps[ps.length - 1].no : 0;
    var tid = 't' + Date.now().toString(36);
    await op('set', 'tables/' + tid, { title: title, cols: cols, order: order });
    for (var i = 1; i <= count; i++) {
      await op('set', 'parties/p' + (maxNo + i), { no: maxNo + i, table: tid, done: false, doneBy: '', doneAt: 0, cells: cols.map(emptyCell) });
    }
  }

  async function wipeAll(keepSettings) {
    var ids = Object.keys(S.parties);
    for (var i = 0; i < ids.length; i++) await op('delete', 'parties/' + ids[i]);
    var tids = Object.keys(S.tables);
    for (var j = 0; j < tids.length; j++) await op('delete', 'tables/' + tids[j]);
    await op('set', 'meta/settings', { sample: false, sequence: null });
  }

  // ---- events ----
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-d');
    if (k && editing) {
      editing.draft[k] = e.target.value;
      if (k === 'm') {
        var mm = S.members[e.target.value];
        if (mm) { editing.draft.t = memberText(mm); editing.draft.tag = mm.tag || 'base'; editing.draft.power = mm.power ? String(mm.power) : ''; }
        render();
      }
    }
  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var a = el.getAttribute('data-act'), pid = el.getAttribute('data-p'), tid = el.getAttribute('data-t'), idx = parseInt(el.getAttribute('data-i'), 10);
    var p = pid ? S.parties[pid] : null;
    if (a === 'ck' && p) {
      var nd = !p.done;
      op('update', 'parties/' + pid, { done: nd, doneBy: nd ? checker : '', doneAt: nd ? Date.now() : 0 });
    } else if (a === 'cell' && p && picked && S.members[picked]) {
      placeMember(pid, idx, picked); picked = ''; render();
    } else if (a === 'cell' && p) {
      var pp = Object.assign({ id: pid }, p), c = cellsOf(pp)[idx] || emptyCell();
      editing = { kind: 'cell', pid: pid, idx: idx, draft: { t: c.t || '', tag: c.tag || 'base', char: c.char || '', server: c.server || '', power: c.power ? String(c.power) : '', m: (c.m && S.members[c.m]) ? c.m : '' } };
      render(); var f = document.getElementById('ed_t'); if (f) { f.focus(); f.select(); }
    } else if (a === 'col' && S.tables[tid]) {
      editing = { kind: 'col', tid: tid, idx: idx, draft: { name: S.tables[tid].cols[idx] || '' } };
      render(); var g = document.getElementById('ed_name'); if (g) { g.focus(); g.select(); }
    } else if (a === 'tag' && editing && editing.kind === 'cell') {
      editing.draft.tag = el.getAttribute('data-v'); render();
    } else if (a === 'cancel') { editing = null; render(); }
    else if (a === 'save' && editing) {
      var ed = editing; editing = null; render();
      if (ed.kind === 'cell' && S.parties[ed.pid]) {
        var cs = cellsOf(Object.assign({ id: ed.pid }, S.parties[ed.pid])).slice(), d = ed.draft;
        if (d.m && S.members[d.m]) { placeMember(ed.pid, ed.idx, d.m); }
        else {
          cs[ed.idx] = { t: d.t.trim(), tag: d.tag, char: d.char.trim(), server: d.server.trim(), power: parsePower(d.power), m: '' };
          op('update', 'parties/' + ed.pid, { cells: cs });
        }
      } else if (ed.kind === 'col' && S.tables[ed.tid]) {
        var cols = S.tables[ed.tid].cols.slice(); cols[ed.idx] = ed.draft.name.trim() || cols[ed.idx];
        op('update', 'tables/' + ed.tid, { cols: cols });
      }
    }
    else if (a === 'delParty' && p) twoStep('dp' + pid, function () { editing = null; op('delete', 'parties/' + pid); });
    else if (a === 'addParty' && S.tables[tid]) {
      var all = allParties(), no = (all.length ? all[all.length - 1].no : 0) + 1;
      op('set', 'parties/p' + no, { no: no, table: tid, done: false, doneBy: '', doneAt: 0, cells: S.tables[tid].cols.map(emptyCell) });
    }
    else if (a === 'delTable' && S.tables[tid]) twoStep('dt' + tid, async function () {
      var list = allParties().filter(function (x) { return x.table === tid; });
      for (var i = 0; i < list.length; i++) await op('delete', 'parties/' + list[i].id);
      await op('delete', 'tables/' + tid);
    });
    else if (a === 'mpick') { picked = (picked === el.getAttribute('data-m')) ? '' : el.getAttribute('data-m'); editing = null; render(); }
    else if (a === 'unpick') { picked = ''; render(); }
    else if (a === 'mnew') dlgMember();
    else if (a === 'medit') dlgMember(el.getAttribute('data-m'));
    else if (a === 'mbulk') dlgBulk();
    else if (a === 'mfilter') { onlyFree = !onlyFree; render(); }
    else if (a === 'rtoggle') { rosterOpen = !rosterOpen; try { localStorage.setItem('aion2-roster-open', rosterOpen ? '1' : '0'); } catch (e) {} render(); }
    else if (a === 'power') dlgPower();
    else if (a === 'addTable') dlgAddTable();
    else if (a === 'settings') dlgSettings();
    else if (a === 'checker') dlgChecker();
    else if (a === 'weekly') twoStep('weekly', async function () {
      var list = allParties().filter(function (x) { return x.done; });
      for (var i = 0; i < list.length; i++) await op('update', 'parties/' + list[i].id, { done: false, doneBy: '', doneAt: 0 });
      toast('체크를 모두 해제했어요');
    });
    else if (a === 'starter') { (async function () { await createTable('루드라', ['파티원 A', '파티원 B', '파티원 C'], 8); await createTable('침식', ['파티원 A', '파티원 B', '파티원 C'], 7); })(); }
    else if (a === 'clearSample') twoStep('clearSample', function () { wipeAll(); });
  });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && picked && !document.getElementById('modalRoot').firstChild) { picked = ''; render(); } });
  render();
  var remote = '';
  try { remote = localStorage.getItem(REMOTE_KEY) || ''; } catch (e) {}
  if (remote) startRemote(remote); else startLocal();
})();
</script>
</body>
</html>
